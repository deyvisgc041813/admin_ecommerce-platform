<div class="d-flex justify-content-between mb-2">
	<div class="form-group" >
		<input
			type="text"
			class="form-control"
			[(ngModel)]="textSearch"
			id="name"
			placeholder="Buscar"
		/>
	</div>
</div>
<div class="table-responsive">
	<table class="table mb-0">
		<thead class="table-light">
			<tr>
				<th>N° Venta</th>
				<th>Estado</th>
			 	<th>Cliente</th>
			 	<th>Fecha</th>
				<th>Tipo</th>
				<th>Tienda</th>
				<th>Comprobante</th>
				<th>Total Descuento</th>
				<th>Total Venta</th>
				<th>Opciones</th>
			</tr>
		</thead>
		<tbody>
			<ng-container *ngIf="list?.content | filter : textSearch as result">
				<tr *ngFor="let item of result | filter : textSearch; let i = index">
					<td>{{ item.id }}</td>
					<td>
						<button
							*ngIf="+item.status === 0"
							type="button"
							class="btn d-flex btn-light-danger d-block text-danger font-medium"
						>
							Por Atenter
						</button>
						<button
							*ngIf="+item.status === 1"
							type="button"
							class="btn d-flex btn-light-success d-block text-success font-medium"
						>
							Atentido
						</button>
					</td>
					<td>{{ item.first_name }} {{ item.last_name}}</td>
					<td>{{ item.fecha_formateada }}</td>
					<td>
						<button
							*ngIf="+item.type === 0"
							type="button"
							class="btn d-flex btn-light-warming d-block text-warming font-medium"
						>
							Reserva
						</button>
						<button
							*ngIf="+item.type === 1"
							type="button"
							class="btn d-flex btn-light-success d-block text-success font-medium"
						>
							Online
						</button>
					</td>
					<td>{{ item.tienda }}</td>
					<td>{{ item.comprobante }}</td>
					<td>{{ item.total_discount }}</td>
					<td>{{ item.total_amount }}</td>

					<td>
						<button
							*ngIf="+item.status === 0"
							type="button"
							ngbTooltip="Atender"
							(click)="atender(item.id)"
							class="btn btn-outline-success btn-sm"
							style="margin-left: 5px"
						>
							<span><i class="fas fa-check"></i></span>
						</button>
						<button
							type="button"
							ngbTooltip="Ver"
							(click)="ver(item.id,item.total_discount,item.total_amount, item.detalle)"
							class="btn btn-outline-primary btn-sm"
							style="margin-left: 5px"
						>
							<span><i class="fas fa-eye"></i></span>
						</button>
						<button
							*ngIf="+item.status === 0"
							type="button"
							ngbTooltip="Eliminar"
							(click)="eliminar(item.id)"
							class="btn btn-sm btn-outline-danger"
							style="margin-left: 5px"
						>
							<span><i class="fas fa-trash"></i></span>
						</button>
					</td>
				</tr>
			</ng-container>
		</tbody>
	</table>
	<app-pagination
		[totalItems]="totalElements"
		[pageSize]="pageSize"
		[currentPage]="pageNumber"
		(pageChange)="onPageChange($event)"
	>
	</app-pagination>
</div>
