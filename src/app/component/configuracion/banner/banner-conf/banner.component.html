<div class="d-flex justify-content-between mb-2">
  <div class="form-group">
    <input
      type="text"
      class="form-control"
      [(ngModel)]="textSearch"
      id="name"
      placeholder="Buscar"
    />
  </div>
</div>
<div class="table-responsive">
  <table class="table mb-0">
    <thead class="table-light">
      <tr>
        <th style="max-width: 200px;">Titulo</th>
        <th style="max-width: 200px;">Empresa</th>
        <th style="max-width: 200px;">Sede</th>
        <th>Etiqueta</th>
        <th>Precio</th>
        <th style="max-width: 200px;">Descripción</th>
        <th >Tipo</th>
        <th>Imagen</th>
        <th>Estado</th>
        <th>Opciones</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="list?.content | filter : textSearch as result">
        <tr *ngFor="let item of result | filter : textSearch; let i = index">
          <td style="max-width: 200px;">{{ item.title }}</td>
          <td style="max-width: 200px;">{{ item.empresa }}</td>
          <td style="max-width: 200px;">{{ item.tienda }}</td>
          <td>{{ item.etiqueta }}</td>
          <td>S/.{{ item.price | number:'1.2-2' }}</td>
          <td style="max-width: 200px;">{{ item.description }}</td>
          <td>{{ item.type }}</td>
          
          <td>
            <img
              width="100"
              height="100"
              [src]="item.image_path "
              [alt]="item.title"
            />
          </td>
          <td>
            <button
              *ngIf="item.status !== 'Active'"
              type="button"
              class="btn d-flex btn-light-danger d-block text-danger font-medium"
            >
              Desabilitado
            </button>
            <button
             *ngIf="item.status === 'Active'"
              type="button"
              class="btn d-flex btn-light-success d-block text-success font-medium"
            >
              Habilitado
            </button>
          </td>

          <td>
            <button
              type="button"
              ngbTooltip="Actualizar Producto"
              (click)="edit(item.banner_id)"
              class="btn btn-outline-success btn-sm"
            >
              <span><i class="fas fa-edit"></i></span>
            </button>
            <button
              type="button"
              *ngIf="item.status === 'Active'"
              ngbTooltip="Desabilitar"
              (click)="changeStatus(item.banner_id, item.status)"
              class="btn btn-sm btn-outline-danger"
              style="margin-left: 5px"
            >
              <i class="fas fa-unlock"></i>
            </button>
            <button
              type="button"
              *ngIf="item.status !== 'Active'"
              ngbTooltip="Habilitar"
              (click)="changeStatus(item.banner_id, item.status)"
              class="btn btn-sm btn-outline-success"
              style="margin-left: 5px"
            >
            <i class="fas fa-lock"></i>
            </button>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
  <app-pagination
    [totalItems]="totalElements"
    [pageSize]="pageSize"
    [currentPage]="pageNumber"
    (pageChange)="onPageChange($event)"
  >
  </app-pagination>
</div>
