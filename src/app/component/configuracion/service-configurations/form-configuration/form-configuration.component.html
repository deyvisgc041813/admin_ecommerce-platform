<div class="modal-header">
  <h5 class="modal-title mt-0" style="font-size: 16px; font-weight: 500">
    {{ titulo }}
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-hidden="true"
    (click)="getDismissReason(0)"
  ></button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="formGrupConfig" style="margin-top: 20px">
            <div class="row">
              <div class="col-lg-12">
                <div class="row">
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">Nombre Servicio</label>
                      <input
                        class="form-control"
                        type="text"
                        formControlName="name_service"
                        placeholder="Ingrese nombre servicio"
                        [ngClass]="{
                          'is-invalid': submitted && f.name_service.errors
                        }"
                      />
                      <div
                        *ngIf="submitted && f.name_service.errors"
                        class="invalid-feedback"
                      >
                        <span *ngIf="f.name_service.errors.required"
                          >Nombre es obligatorio.</span
                        >
                      </div>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">Tipo Servicio</label>
                      <ng-select
                        [items]="tipoServicio"
                        bindLabel="label"
                        bindValue="value"
                        [ngClass]="{
                          'is-invalid': submitted && f.type_service.errors
                        }"
                        formControlName="type_service"
                        placeholder="Seleccione tipo servicio"
                      ></ng-select>
                      <div
                        *ngIf="submitted && f.type_service.errors"
                        class="invalid-feedback"
                      >
                        <span *ngIf="f.type_service.errors?.required"
                          >Tipo servicio es obligatorio.</span
                        >
                      </div>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">LLave Publica</label>
                      <input
                        class="form-control"
                        type="text"
                        formControlName="public_key"
                        placeholder="Ingrese su llave publica"
                      />
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">LLave Privada</label>
                      <input
                        class="form-control"
                        type="text"
                        formControlName="private_key"
                        placeholder="Ingrese su llave privada"
                      />
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">Empresa</label>
                      <ng-select
                        [items]="companys"
                        bindLabel="name"
                        bindValue="company_id"
                        [ngClass]="{
                          'is-invalid': submitted && f.company_id.errors
                        }"
                        formControlName="company_id"
                        placeholder="Seleccione tipo documento"
                      ></ng-select>
                      <div
                        *ngIf="submitted && f.company_id.errors"
                        class="invalid-feedback"
                      >
                        <span *ngIf="f.company_id.errors?.required"
                          >Empresa es obligatorio.</span
                        >
                      </div>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label class="control-label">Fecha Expiración</label>
                      <div class="input-group clockpicker">
                        <input
                          ngbDatepicker
                          class="form-control"
                          formControlName="expiration_date"
                          placeholder="yyyy-mm-dd"
                          #d="ngbDatepicker"
                        />
                        <div class="input-group-append" (click)="d.toggle()">
                          <span class="input-group-text"
                            ><i class="mdi mdi-calendar"></i
                          ></span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-12">
                    <div class="mb-3">
                      <label class="control-label">Descripción</label>
                      <textarea
                        formControlName="description"
                        class="form-control"
                        class="form-control rounded"
                        id="exampleFormControlTextarea1"
                        rows="3"
                      ></textarea>
                    </div>
                  </div>
                </div>
              </div>
              <hr />
              <div class="col-lg-12">
                <div class="mb-3">
                  <button type="button" class="btn btn-outline-success" (click)="agregarUrls()">Agregar Url</button>
                </div>
              </div>
              <p></p>
              <div formArrayName="endpoint_url" *ngIf="urls" [ngClass]="urls.length > 2 ? 'scroll-form' : ''">
                <div class="container">
                  <div
                    *ngFor="let url of urls.controls; let i = index"
                    [formGroupName]="i"
                  >
                    <ng-container *ngIf="url as UrlsFormGroup">
                      <div class="row d-flex justify-content-around">
                      <div class="col-md-3 mb-4">
                        <div class="form-group">
                          <label for="inputNombre">Nombre Url</label>
                          <input
                            type="text"
                            class="form-control text-uppercase"
                            formControlName="name_url"
                            id="inputNombre"
                            [ngClass]="{ 'is-invalid': submitted && UrlsFormGroup.get('name_url') ?.invalid }"
                          />
                          <div *ngIf=" submitted && UrlsFormGroup.get('name_url') ?.invalid "class="invalid-feedback">
                            <div *ngIf=" UrlsFormGroup.get('name_url' )?.hasError('required') ">
                              Nombre url es requerido
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-4 mb-4">
                      <label for="inputNombre">Tipo Pago</label>
                      <ng-select
                        [items]="tipoPago"
                        bindLabel="label"
                        bindValue="value"
                        formControlName="type_pago"
                        placeholder="Seleccione tipo pago"
                      ></ng-select>
                      </div>
                      <div class="col-md-4 mb-4">
                        <div class="form-group">
                          <label for="inputNombre">url</label>
                          <input
                            type="text"
                            class="form-control text-uppercase"
                            formControlName="endpoint_url"
                            id="inputNombre"
                            [ngClass]="{ 'is-invalid': submitted && UrlsFormGroup.get('endpoint_url') ?.invalid }"
                          />
                          <div *ngIf=" submitted && UrlsFormGroup.get('endpoint_url') ?.invalid "class="invalid-feedback">
                            <div *ngIf=" UrlsFormGroup.get('endpoint_url' )?.hasError('required') ">
                              Url es requerido
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-1 mb-4">
                          <div class="form-group">
                            <button
                              type="button"
                              (click)="eliminar(i)"
                              class="btn btn-sm btn-outline-danger"
                              style="margin-top: 30px"
                            >
                              <span><i class="fas fa-trash"></i></span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </ng-container>
                  </div>
                </div>
              </div>
            </div>
            <p></p>
            <div class="d-flex justify-content-end">
              <button
                type="button"
                (click)="guardar()"
                class="btn btn-success"
                id="btn-save-event"
                [disabled]="isLoading"
              >
                <span *ngIf="isLoading"
                  ><i class="bx bx-hourglass bx-spin mr-2"></i
                ></span>
                <span *ngIf="!isLoading">Guardar</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
