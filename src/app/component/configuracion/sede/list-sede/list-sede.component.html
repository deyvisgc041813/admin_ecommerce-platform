<div class="d-flex justify-content-between mb-2">
    <div class="form-group" >
      <input
        type="text"
        class="form-control"
        [(ngModel)]="textSearch"
        id="name"
        placeholder="Buscar"
      />
    </div>
  </div>
  <div class="table-responsive">
    <table class="table mb-0">
      <thead class="table-light">
        <tr>
          <th>Empresa</th>
          <th>Sede</th>
          <th>Correo</th>
          <th>Telefono</th>
          <th>Dirección</th>
          <th>Departamento</th>
          <th>Distrito</th>
          <th>Provincia</th>
          <th>Estado</th>
          <th>Opciones</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="list?.content | filter : textSearch as result">
          <tr *ngFor="let item of result | filter : textSearch; let i = index">
            <td>{{ item.company}}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.phone }}</td>
            <td>{{ item.address }}</td>
            <td>{{ item.departamento }}</td>
            <td>{{ item.distrito }}</td>
            <td>{{ item.provincia }}</td>
            <td>
              <button
                *ngIf="+item.status === 0"
                type="button"
                class="btn d-flex btn-light-danger d-block text-danger font-medium"
              >
                Desabilitado
              </button>
              <button
                *ngIf="+item.status === 1"
                type="button"
                class="btn d-flex btn-light-success d-block text-success font-medium"
              >
                Habilitado
              </button>
            </td>
            <td>
              <button
                type="button"
                ngbTooltip="Actualizar compania"
                (click)="edit(item.store_id)"
                class="btn btn-outline-success btn-sm"
              >
                <span><i class="fas fa-edit"></i></span>
              </button>
              <button
                type="button"
                *ngIf="+item.status === 1"
                ngbTooltip="Desabilitar"
                (click)="changeStatus(item.store_id, item.status)"
                class="btn btn-sm btn-outline-danger"
                style="margin-left: 5px"
              >
                <i class="fas fa-unlock"></i>
              </button>
              <button
                type="button"
                *ngIf="+item.status === 0"
                ngbTooltip="Habilitar"
                (click)="changeStatus(item.store_id, item.status)"
                class="btn btn-sm btn-outline-success"
                style="margin-left: 5px"
              >
              <i class="fas fa-lock"></i>
              </button>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
    <app-pagination
      [totalItems]="totalElements"
      [pageSize]="pageSize"
      [currentPage]="pageNumber"
      (pageChange)="onPageChange($event)"
    >
    </app-pagination>
  </div>
