<div class="modal-header">
  <h5 class="modal-title mt-0">Agregar Menus</h5>
  <button
    type="button"
    class="btn-close"
    aria-hidden="true"
    (click)="getDismissReason(0)"
  ></button>
</div>
<div class="modal-body">
  <div class="card">
    <div class="card-body">
      <form [formGroup]="formMenuGrup" class="space-y-3">
        <div class="row mb-3">
          <div class="col-md-8 mb-2">
            <div class="form-group">
              <label for="exampleFormControlTextarea1"
                >Seleccione Sub Menu</label
              >
              <ng-select
                [items]="subMenus"
                bindLabel="subcategory_name"
                formControlName="sub_menu_id"
                placeholder="Seleccionar"
                bindValue="subcategory_id"
                [ngClass]="{ 'is-invalid': submitted && subMenu?.invalid }"
              >
              </ng-select>
              <div
                *ngIf="submitted && subMenu?.invalid"
                class="invalid-feedback"
              >
                <div *ngIf="subMenu.errors?.['required']">
                  Sub menu es requerido
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4 mt-2">
            <button
              type="button"
              *ngIf="menuPrincipal?.length == 0"
              class="btn btn-outline-success mt-3"
              (click)="agregarMenuPrincipal()"
            >
              Agregar navegación
            </button>
          </div>
        </div>
        <div
          formArrayName="menuPrincipal"
          [ngClass]="menuPrincipal.length < 5 ? '' : 'scroll-form'"
        >
          <div class="container mt-2">
            <div
              *ngFor="let menu of menuPrincipal?.controls; let i = index"
              [formGroupName]="i"
            >
              <ng-container *ngIf="menu as menuFormGroup">
                <!-- Grupo de preferencias del usuario -->
                <fieldset class="p-3 border rounded mb-3">
                  <legend class="font-weight-bold">
                    <h5>Navegación Principal</h5>
                  </legend>
                  <div class="row d-flex justify-content-around">
                    <!-- Columna para el título -->
                    <div class="col-sm-5 col-md-5 col-lg-5 col-xl-4 col-xxl-4">
                      <div class="form-group">
                        <label for="inputNombre">Titulo</label>
                        <textarea
                          class="form-control"
                          formControlName="titulo"
                          rows="4"
                          placeholder="Escribe descripcion...."
                        ></textarea>
                        <div
                          *ngIf="
                            submitted && menuFormGroup.get('titulo')?.invalid
                          "
                          class="invalid-feedback"
                        >
                          <div
                            *ngIf="
                              menuFormGroup.get('titulo')?.hasError('required')
                            "
                          >
                            Titulo es requerido
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- Columna para el componente de carga de archivo -->
                    <div class="col-md-5 mb-3">
                      <div class="form-group">
                        <div class="custom-dropzone-container">
                          <div
                            class="dropzone"
                            ngx-dropzone
                            [multiple]="false"
                            accept="image/jpeg,image/jpg,image/png,image/webp"
                            (change)="onArchivoCargado($event, i)"
                          >
                            <div
                              style="
                                font-size: 15px;
                                font-weight: bolder;
                                text-align: center;
                                width: 280px;
                              "
                              ngx-dropzone-label
                              *ngIf="!menuFormGroup?.get('archivo')?.value"
                            >
                              Arrastrar Imagen
                            </div>
                            <img
                              width="270"
                              height="80"
                              style=""
                              [src]="
                                menuFormGroup?.get('archivo')?.value
                                  ? menuFormGroup?.get('archivo')?.value
                                      ?.preview
                                  : ''
                              "
                              *ngIf="menuFormGroup?.get('archivo')?.value"
                            />

                            <button
                              *ngIf="menuFormGroup?.get('archivo')?.value"
                              type="button"
                              style="
                                margin-top: -58px;
                                font-size: 7px;
                                margin-left: 10px;
                              "
                              class="btn btn-sm btn-outline-danger btn-delete"
                              (click)="eliminarImagen(menuFormGroup)"
                            >
                              <i class="fas fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-1" style="margin-left: 10px;">
                      <div class="form-group">
                          <button type="button"
                              (click)="eliminarMenuPrincipal(i)"
                              class="btn btn-sm btn-outline-danger"
                              style="margin-top: 25px">
                              <span><i class="fas fa-trash"></i></span>
                          </button>
                      </div>
                  </div>
                  </div>
                  <!-- Fin del row -->
                </fieldset>
                <!-- Grupo de credenciales del usuario -->
              </ng-container>
            </div>
          </div>
        </div>
        <fieldset class="p-3 border rounded">
          <legend class="font-weight-bold">
            <h5>Filtros de Navegación</h5>
          </legend>

          <div class="col-lg-12">
            <div class="card">
              <div class="card-body">
                <button
                  type="button"
                  class="btn btn-outline-success mt-3"
                  (click)="agregarMenuSecundario()"
                >
                  Agregar criterios
                </button>
                <div
                  formArrayName="menuSecundario"
                  [ngClass]="menuSecundario.length < 5 ? '' : 'scroll-form'"
                >
                  <div class="container mt-2">
                    <div
                      *ngFor="
                        let menu of menuSecundario?.controls;
                        let i = index
                      "
                      [formGroupName]="i"
                    >
                      <ng-container *ngIf="menu as menuFormSecundario">
                        <div class="row d-flex justify-content-around">
                          <div class="col-md-4 mb-2">
                            <div class="form-group">
                              <label for="exampleFormControlTextarea1"
                                >Criterio de Busqueda</label
                              >
                              <ng-select
                                [items]="menuCategory"
                                bindLabel="category_name"
                                (change)="changeCategoriaMenu($event, i)"
                                formControlName="menu_category"
                                placeholder="Seleccionar"
                                bindValue="id"
                                [ngClass]="{
                                  'is-invalid':
                                    submitted &&
                                    menuFormSecundario?.get('menu_category')
                                      ?.invalid
                                }"
                              >
                              </ng-select>
                              <div
                                *ngIf="
                                  submitted &&
                                  menuFormSecundario?.get('menu_category')
                                    ?.invalid
                                "
                                class="invalid-feedback"
                              >
                                <div
                                  *ngIf="
                                    menuFormSecundario
                                      ?.get('menu_category')
                                      ?.hasError('required')
                                  "
                                >
                                  Tipo de búsqueda es requerido
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-3 mb-3">
                            <div class="form-group" ngSwitch="">
                              <label for="exampleFormControlTextarea1"
                                >Parametros</label
                              >

                              <div>
                                <ng-select
                                  [items]="
                                    menuFormSecundario.get('menuSelected').value
                                  "
                                  bindLabel="name"
                                  [multiple]="
                                    menuFormSecundario.get('isMultiple').value
                                  "
                                  placeholder="Seleccionar"
                                  formControlName="filter"
                                  bindValue="param_filters"
                                  [ngClass]="{
                                    'is-invalid':
                                      submitted &&
                                      menuFormSecundario?.get('filter')?.invalid
                                  }"
                                >
                                </ng-select>
                              </div>
                              <div
                                *ngIf="
                                  submitted &&
                                  menuFormSecundario?.get('filter')?.invalid
                                "
                                class="invalid-feedback"
                              >
                                <div
                                  *ngIf="
                                    menuFormSecundario
                                      ?.get('filter')
                                      ?.hasError('required')
                                  "
                                >
                                  Parametro de búsqueda es requerido
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-4 mb-3">
                            <div class="form-group">
                              <label for="inputNombre">Descripciòn</label>
                              <input
                                type="text"
                                class="form-control text-uppercase"
                                formControlName="titulo"
                                id="inputNombre"
                                [ngClass]="{
                                  'is-invalid':
                                    submitted &&
                                    menuFormSecundario?.get('titulo')?.invalid
                                }"
                              />
                              <div
                                *ngIf="
                                  submitted &&
                                  menuFormSecundario?.get('titulo')?.invalid
                                "
                                class="invalid-feedback"
                              >
                                <div
                                  *ngIf="
                                    menuFormSecundario
                                      ?.get('titulo')
                                      ?.hasError('required')
                                  "
                                >
                                  Titulo es requerido
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-1">
                            <div class="form-group">
                              <button
                                type="button"
                                (click)="eliminarMenuSecundario(i)"
                                class="btn btn-sm btn-outline-danger"
                                style="margin-top: 25px"
                              >
                                <span><i class="fas fa-trash"></i></span>
                              </button>
                            </div>
                          </div>
                        </div>
                      </ng-container>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </fieldset>
        <div class="d-flex justify-content-end">
          <button
            type="submit"
            class="btn btn-outline-info rounded mt-3"
            (click)="guardar()"
          >
            <span *ngIf="!isLoading">Guardar</span>
            <i *ngIf="isLoading" class="fas fa-spinner fa-pulse fa-2x"></i>
          </button>
        </div>
      </form>
    </div>
    <!-- Fin del card-body -->
  </div>
  <!-- Fin del card -->
</div>
<!-- Fin del modal-body -->
