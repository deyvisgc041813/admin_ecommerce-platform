<div class="card">
  <div class="card-body">
    <div class="row mb-md-2">
      <div class="col-12 col-md-6 mb-2 mb-md-0">
        <div class="dataTables_length" id="tickets-table_length">
          <label class="d-inline-flex align-items-center"
            >Mostrar
            <select
              name="tickets-table_length"
              aria-controls="tickets-table"
              [(ngModel)]="filtros.size"
              (change)="onPageSizeChange(filtros.size)"
              class="form-control form-control-sm mx-2"
            >
              <option [ngValue]="10">10</option>
              <option [ngValue]="25">25</option>
              <option [ngValue]="50">50</option>
              <option [ngValue]="100">100</option>
            </select>
            entradas</label
          >
        </div>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <div class="form-group">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="textSearch"
            id="name"
            placeholder="Buscar"
          />
        </div>
      </div>
      <!-- End search -->
    </div>
    <div class="table-responsive">
      <table class="table mb-0">
        <thead class="table-light">
          <tr>
            <th>Imagen</th>
             <th>Descripcion</th>
            <th>Fecha creación</th>
            <th>Estado</th>
            <th>Opciones</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngIf="list?.content | filter: textSearch as result">
            <tr *ngFor="let item of result | filter: textSearch; let i = index">
              <td ><img style="width: 50px; height: 50px;" [src]="item.logo" /></td>
              <td>{{ item.descripcion }}</td>
              <td>{{ item.fechaCreacion | fechaIso }}</td>
              <td>{{ item.estado }}</td>
              <td>
                <button
                  type="button"
                  ngbTooltip="Actualizar menu"
                  (click)="edit(item.parentId)"
                  class="btn btn-sm btn-outline-success"
                >
                  <span><i class="fas fa-edit"></i></span>
                </button>
                <!-- <button
                  type="button"
                  ngbTooltip="Eliminar menu"
                  (click)="eliminar(item.parentId)"
                  class="btn btn-sm btn-outline-danger"
                  style="margin-left: 5px"
                >
                  <span><i class="fas fa-trash"></i></span>
                </button> -->
                <button type="button" [ngbTooltip]="item.estado === 'Active' ? 'Desactivar': 'Activar'" (click)="actualizarEstado(item.parentId, item.estado)"
                  class="btn btn-sm btn-outline-danger ms-1"
                  [ngClass]="{'btn-outline-danger': item.estado === 'Active', 'btn-outline-success': item.estado === 'Inactive'}">
                  <span><i class="fas fa-toggle-off" *ngIf="item.estado === 'Active'"></i></span>
                  <span><i class="fas fa-toggle-on" *ngIf="item.estado === 'Inactive'"></i></span>
                </button>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
    <div class="row justify-content-md-between align-items-md-center mt-2">
      <div class="col-12 col-md-5 mb-2 mb-md-0">
        <div
          class="dataTables_info"
          id="tickets-table_info"
          role="status"
          aria-live="polite"
        >
          Mostrando {{ filtros.page }} a {{ filtros.size }} de
          {{ totalElements }} entradas
        </div>
      </div>
      <!-- Pagination -->
      <div class="col-12 col-md-5">
        <div class="d-flex justify-content-end justify-content-md-end">
          <!-- <ngb-pagination
            [collectionSize]="total"
            [(page)]="filtros.page"
            [pageSize]="filtros.pageSize"
            (pageChange)="onPageChange($event)"
          >
          </ngb-pagination> -->
          <app-pagination
            [totalItems]="totalElements"
            [pageSize]="filtros.size"
            [currentPage]="filtros.page"
            (pageChange)="onPageChange($event)"
          >
          </app-pagination>
        </div>
      </div>
      <!-- End Pagination -->
    </div>
  </div>
</div>
