
<div class="row">
  <div class='col-sm-7' >
    <span class="text-dark font-weight-bolder">Mostrando del {{page}} al {{(pageSize*page)>pageSizeTable?pageSizeTable:(pageSize*page)}} de un total {{pageSizeTable}} registros</span>
  </div>
  <div class="col-sm-5">
    <ul class="pagination pagination-rounded justify-content-end mb-2">
      <li class="page-item">
        <a class="page-link" href="javascript: void(0);" aria-label="Previous" (click)="anterior()">
          <i class="mdi mdi-chevron-left"></i>
        </a>
      </li>
      <li class="page-item" [ngClass]="{'active': page === numberPagina}" *ngFor="let numberPagina of NumberPaginacion; let i = index">
        <a class="page-link" href="javascript: void(0);" (click)="siguiente(numberPagina)">
          {{numberPagina}}
        </a>
      </li>
      <li class="page-item">
        <a class="page-link" href="javascript: void(0);" aria-label="Next" (click)="siguiente(0)">
          <i class="mdi mdi-chevron-right"></i>
        </a>
      </li>
    </ul>
  </div>
</div>
