<div class="container-fluid">
  <app-page-title title="Historial de Productos" [breadcrumbItems]="breadCrumbItems"></app-page-title>
  <div class="d-flex justify-content-end mb-2">  
    <button class="btn btn-outline-info btn-group-lg btn-sm" (click)="open()">Nuevo <i class="fas fa-plus"></i>
    </button>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="col-md-3 mb-3">
            <div class="form-group">
              <label for="exampleInputPassword1">Buscar por Tiendas</label>
              <div class="custom-dropdown-container">
                <ng-select [items]="tiendas" bindLabel="name"  [(ngModel)]="tiendaDefault" bindValue="store_id">
                </ng-select>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <app-product-list (update)="isUpdate($event)" [storeId]="this.tiendaDefault"></app-product-list>
        </div>
      </div>
    </div>
  </div>
</div>
<!--  -->
<ng-template #content>
  <app-form (success)="onSuccess($event)"></app-form>
</ng-template>
